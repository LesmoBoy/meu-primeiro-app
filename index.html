<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Rodagem</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, system-ui, sans-serif;
    background: #111511;
    color: #f1f5ed;
    --surface: #1b231d;
    --muted: #adbcaf;
    --line: #354339;
    --accent: #c7f984;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100% - 32px, 620px); margin: 44px auto; }
  h1 { font-size: clamp(2.5rem, 9vw, 4rem); line-height: 1; letter-spacing: -.07em; margin: 0; }
  header p, .hint { color: var(--muted); line-height: 1.5; }
  nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 28px 0 12px; }
  button { font: inherit; font-weight: 700; min-height: 46px; cursor: pointer; border-radius: 12px; }
  nav button { background: var(--surface); border: 1px solid var(--line); color: inherit; }
  nav button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(18px, 5vw, 28px); }
  h2 { font-size: 1.35rem; margin: 0 0 12px; }
  label { display: grid; gap: 6px; font-size: .9rem; font-weight: 600; }
  input { width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); color: inherit; background: #111712; padding: 10px 12px; font: inherit; font-size: 1rem; }
  input::placeholder { color: #9aa99d; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  form { display: grid; gap: 14px; }
  .primary { background: var(--accent); color: #172010; border: 0; margin-top: 4px; }
  .hint { margin: 0 0 16px; font-size: .89rem; }
  .results { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 18px; }
  dl { margin: 0; display: grid; gap: 12px; }
  dl div { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-size: 1.25rem; font-weight: 750; color: var(--accent); text-align: right; overflow-wrap: anywhere; min-width: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Minha Rodagem</h1>
    <p>Fechamento das entregas e consumo da moto.</p>
  </header>
  <nav aria-label="Calculadoras">
    <button type="button" data-panel="fechamento" aria-controls="fechamento" aria-pressed="true">Fechamento</button>
    <button type="button" data-panel="consumo" aria-controls="consumo" aria-pressed="false">Consumo</button>
  </nav>

  <section id="fechamento" class="card" aria-labelledby="titulo-fechamento">
    <h2 id="titulo-fechamento">Fechamento do dia</h2>
    <form id="form-fechamento">
      <label>Quanto você ganhou (R$)
        <input name="ganhos" type="text" inputmode="decimal" placeholder="Ex. 180,00" required>
      </label>
      <label>Quanto você gastou (R$)
        <input name="gastos" type="text" inputmode="decimal" placeholder="Ex. 35,00" required>
      </label>
      <label>Entregas concluídas
        <input name="entregas" type="text" inputmode="numeric" placeholder="Ex. 20" required>
      </label>
      <button class="primary">Calcular fechamento</button>
    </form>
    <div class="results" hidden aria-live="polite" aria-atomic="true">
      <dl>
        <div><dt>Saldo do dia</dt><dd id="saldo"></dd></div>
        <div><dt>Saldo por entrega</dt><dd id="media"></dd></div>
      </dl>
    </div>
  </section>

  <section id="consumo" class="card" aria-labelledby="titulo-consumo" hidden>
    <h2 id="titulo-consumo">Consumo da moto</h2>
    <p class="hint">Encha o tanque e zere o hodômetro parcial. No próximo tanque cheio, informe os km rodados e os litros e o valor desse abastecimento.</p>
    <form id="form-consumo">
      <label>Distância rodada (km)
        <input name="distancia" type="text" inputmode="decimal" placeholder="Ex. 240" required>
      </label>
      <label>Litros abastecidos (L)
        <input name="litros" type="text" inputmode="decimal" placeholder="Ex. 8,5" required>
      </label>
      <label>Valor do abastecimento (R$)
        <input name="valor" type="text" inputmode="decimal" placeholder="Ex. 52,00" required>
      </label>
      <button class="primary">Calcular consumo</button>
    </form>
    <div class="results" hidden aria-live="polite" aria-atomic="true">
      <dl>
        <div><dt>Consumo médio</dt><dd id="rendimento"></dd></div>
        <div><dt>Combustível por km</dt><dd id="custo"></dd></div>
      </dl>
    </div>
  </section>
</main>
<script>
  const moeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const decimal = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
  const abas = document.querySelectorAll('nav button');

  abas.forEach(aba => {
    aba.addEventListener('click', () => {
      abas.forEach(item => {
        const ativa = item === aba;
        item.setAttribute('aria-pressed', ativa);
        document.getElementById(item.dataset.panel).hidden = !ativa;
      });
    });
  });

  function lerNumero(campo, casasDecimais, minimo) {
    const texto = campo.value.trim();
    // O ponto e a vírgula servem como separadores decimais.
    const formato = casasDecimais === 0
      ? /^\d+$/
      : new RegExp('^\\d+([,.]\\d{1,' + casasDecimais + '})?$');
    const valor = Number(texto.replace(',', '.'));

    if (!formato.test(texto) || !Number.isFinite(valor) || valor < minimo || valor > 1000000000) {
      const mensagem = minimo > 0 ? 'Digite um valor maior que zero.' : 'Digite um número válido.';
      campo.setCustomValidity(mensagem + (casasDecimais ? ' Use até ' + casasDecimais + ' casas decimais.' : ' Use um número inteiro.'));
      campo.reportValidity();
      return null;
    }
    return valor;
  }

  function configurarFormulario(id, calcular) {
    const formulario = document.getElementById(id);
    const resultado = formulario.nextElementSibling;
    formulario.addEventListener('input', evento => {
      evento.target.setCustomValidity('');
      resultado.hidden = true;
    });
    formulario.addEventListener('submit', evento => {
      evento.preventDefault();
      resultado.hidden = !calcular(formulario.elements);
    });
  }

  configurarFormulario('form-fechamento', campos => {
    const ganhos = lerNumero(campos.ganhos, 2, 0);
    if (ganhos === null) return false;
    const gastos = lerNumero(campos.gastos, 2, 0);
    if (gastos === null) return false;
    const entregas = lerNumero(campos.entregas, 0, 0);
    if (entregas === null) return false;

    // Subtrair em centavos evita resíduos da aritmética decimal.
    const saldo = (Math.round(ganhos * 100) - Math.round(gastos * 100)) / 100;
    document.getElementById('saldo').textContent = moeda.format(saldo);
    document.getElementById('media').textContent = entregas ? moeda.format(saldo / entregas) : '—';
    return true;
  });

  configurarFormulario('form-consumo', campos => {
    const distancia = lerNumero(campos.distancia, 2, 0.01);
    if (distancia === null) return false;
    const litros = lerNumero(campos.litros, 3, 0.001);
    if (litros === null) return false;
    const valor = lerNumero(campos.valor, 2, 0);
    if (valor === null) return false;

    document.getElementById('rendimento').textContent = decimal.format(distancia / litros) + ' km/L';
    document.getElementById('custo').textContent = moeda.format(valor / distancia);
    return true;
  });
</script>
</body>
</html>
