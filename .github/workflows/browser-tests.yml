name: Testes reais do Minha Rodagem

on:
  push:
    branches:
      - 'codex/testes-navegador-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium · celular, desktop e offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      APP_URL: ''
      BUSINESS_ONLY: ${{ contains(github.event.head_commit.message, '[business-only]') }}
      VISUAL_ONLY: ${{ contains(github.event.head_commit.message, '[visual-only]') }}
    steps:
      - name: Obter os arquivos do teste
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar ferramenta de teste
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium e bibliotecas
        run: npx playwright install --with-deps chromium
      - name: Testar o app publicado com dados fictícios
        run: npm run test:gps-core && npm run test:profiles-core && node qa/vehicle-catalog-test.cjs && npm run test:cloud && npm run test:google-identity-dom && npm run test:dom && npm run test:connection && node qa/sw-test.cjs && npm run test:business-core && npm run test:business-client && npm run test:billing
      - name: Testar os fluxos principais com dados fictícios
        if: env.BUSINESS_ONLY != 'true'
        run: npm run test:browser
      - name: Testar mapa, GPS e proteção do percurso
        if: always() && env.BUSINESS_ONLY != 'true' && env.VISUAL_ONLY != 'true'
        run: node qa/gps-browser.cjs
      - name: Testar criação e troca de perfis locais
        if: always() && env.BUSINESS_ONLY != 'true' && env.VISUAL_ONLY != 'true'
        run: npm run test:profiles
      - name: Testar veículos, atividades e estado da entrada Google
        if: always() && env.BUSINESS_ONLY != 'true' && env.VISUAL_ONLY != 'true'
        run: npm run test:fleet
      - name: Testar botão Google, cancelamento e acessibilidade
        if: always() && env.BUSINESS_ONLY != 'true'
        run: npm run test:google-identity
      - name: Testar empresa, equipe, frota, custos e alertas
        if: always() && env.VISUAL_ONLY != 'true'
        run: npm run test:business
      - name: Exibir prévia para revisão visual
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const name of ['failure-viewport.png','mobile-viewport.png','desktop-viewport.png','transport-mobile.png','transport-desktop.png','transport-company.png','transport-balance.png','gps-mobile.png','gps-desktop.png','gps-failure.png','profiles-mobile.png','profiles-desktop.png','profiles-failure.png','fleet-mobile.png','fleet-desktop.png','fleet-failure.png','google-identity-mobile.png','google-identity-desktop.png','business-mobile.png','business-desktop.png','business-failure.png']) {
            const path = 'qa/' + name;
            if (!fs.existsSync(path)) continue;
            const encoded = fs.readFileSync(path).toString('base64');
            for (let start = 0, part = 0; start < encoded.length; start += 4000, part++) {
              console.log('BROWSER_IMAGE:' + name + ':' + part + ':' + encoded.slice(start,start+4000));
            }
          }
          NODE
      - name: Guardar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minha-rodagem-chromium
          path: |
            qa/report.json
            qa/gps-report.json
            qa/profiles-report.json
            qa/fleet-report.json
            qa/business-report.json
            qa/google-identity-report.json
            qa/*.png
          if-no-files-found: warn
          retention-days: 3
