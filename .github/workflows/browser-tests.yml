name: Testes reais do Minha Rodagem

on:
  push:
    branches:
      - 'codex/testes-navegador-*'
      - 'codex/desenvolvimento-v3.2.3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium · celular, desktop e offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      APP_URL: ''
      BUSINESS_ONLY: ${{ contains(github.event.head_commit.message, '[business-only]') }}
      VISUAL_ONLY: ${{ contains(github.event.head_commit.message, '[visual-only]') }}
    steps:
      - name: Obter os arquivos do teste
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar ferramenta de teste
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium e bibliotecas
        run: npx playwright install --with-deps chromium
      - name: Testar todas as suítes locais e regressões com dados fictícios
        run: node qa/v323/run-local-tests.mjs
      - name: Ensaiar rollback local e cache sem publicar
        run: python qa/v323/rollback-dry-run.py
      - name: Testar os fluxos principais com dados fictícios
        if: env.BUSINESS_ONLY != 'true'
        run: npm run test:browser
      - name: Testar mapa, GPS e proteção do percurso
        if: always() && env.BUSINESS_ONLY != 'true' && env.VISUAL_ONLY != 'true'
        run: node qa/gps-browser.cjs
      - name: Testar criação e troca de perfis locais
        if: always() && env.BUSINESS_ONLY != 'true' && env.VISUAL_ONLY != 'true'
        run: npm run test:profiles
      - name: Testar veículos, atividades e estado da entrada Google
        if: always() && env.BUSINESS_ONLY != 'true' && env.VISUAL_ONLY != 'true'
        run: npm run test:fleet
      - name: Testar botão Google, cancelamento e acessibilidade
        if: always() && env.BUSINESS_ONLY != 'true'
        run: npm run test:google-identity
      - name: Testar empresa, equipe, frota, custos e alertas
        if: always() && env.VISUAL_ONLY != 'true'
        run: npm run test:business
      - name: Testar regressões da candidata 3.2.3 no Chromium
        if: always() && env.BUSINESS_ONLY != 'true' && env.VISUAL_ONLY != 'true'
        run: node qa/v323/browser-regressions.cjs
      - name: Registrar capturas disponíveis
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const directory of ['qa','qa/v323']) {
            for (const name of fs.readdirSync(directory).filter(name => name.endsWith('.png'))) {
              console.log(directory + '/' + name + ': ' + fs.statSync(directory + '/' + name).size + ' bytes; ver artefato');
            }
          }
          NODE
      - name: Guardar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minha-rodagem-chromium
          path: |
            qa/report.json
            qa/gps-report.json
            qa/profiles-report.json
            qa/fleet-report.json
            qa/business-report.json
            qa/google-identity-report.json
            qa/v323/local-suite-report.json
            qa/v323/*-report.json
            qa/v323/evidence/local-*.log
            qa/v323/browser-*.png
            qa/*.png
          if-no-files-found: warn
          retention-days: 3

  postgres:
    name: PostgreSQL 17 · sincronização, empresas e cobrança isolada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter os arquivos do teste
        uses: actions/checkout@v4
      - name: Testar sincronização pessoal em banco descartável
        run: bash supabase/test-postgres.sh 2>&1 | tee qa/postgres-personal-ci.log
      - name: Testar empresas, concorrência e cobrança desativada
        run: bash supabase/test-enterprise.sh 2>&1 | tee qa/postgres-enterprise-ci.log
      - name: Conferir migrações e definições finais do banco
        run: python qa/migrations-chain-test.py
      - name: Regressões de concorrência e tamanho JSONB
        run: python qa/v323/postgres-hml-races.py && python qa/v323/backup-budget-postgres.py
      - name: Guardar evidências PostgreSQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minha-rodagem-postgres
          path: |
            qa/postgres-*-ci.log
            qa/migrations-chain-report.json
          retention-days: 3

  authenticated-http:
    name: Auth e PostgREST reais · contas sintéticas e rede isolada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências fixas
        run: npm ci --no-audit --no-fund
      - name: Homologar HTTP autenticado local sem provedores externos
        run: node qa/v323/auth-http-hml.cjs
      - name: Guardar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minha-rodagem-auth-http
          path: qa/v323/auth-http-report.json
          retention-days: 3
